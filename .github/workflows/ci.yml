name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Two Go versions on purpose. The seeded output is contractually stable for a
  # given (algorithmVersion, packFingerprint), and that contract would break
  # silently if a toolchain upgrade changed anything we depend on for the
  # deterministic path. The golden tests are the tripwire; the matrix is what
  # makes them fire before a release rather than after.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.4", "stable"] # keep the first entry in sync with go.mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...

  # RNF-09: the core and the built-in packs stay on the standard library.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: no external dependencies
        run: make deps

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz (short)
        run: make test-fuzz

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Build golangci-lint (v2) from source with the runner's Go, so its build
      # version matches the go.mod directive (the prebuilt action binary lags and
      # trips golangci-lint's "built with an older Go than the target" guard).
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          golangci-lint run ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Tags main when every check above has passed.
  #
  # No GitHub Release is created: @semantic-release/github is deliberately absent
  # from .releaserc.json. Creating and pushing the git tag is semantic-release
  # core behaviour, not a plugin's, so omitting that plugin leaves exactly the
  # tag and nothing else.
  #
  # Node lives only here. It never reaches go.mod, so the zero-dependency
  # guarantee the deps job enforces is untouched.
  release:
    needs: [test, deps, fuzz, lint, vuln]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the full history to find the previous tag and
          # every commit since it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
